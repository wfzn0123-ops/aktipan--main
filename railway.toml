# Railway monorepo configuration
# Deploy backend from be_aktipan-main subfolder
[build]
builder = "nixpacks"
buildCommand = "cd be_aktipan-main && npm install && npm run build"

[deploy]
startCommand = "node be_aktipan-main/dist/server.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
